<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>騎手 芝・ダート スタイルシフトマップ P0 | min100版</title><link rel="stylesheet" href="jockey_turf_dirt_style_shift.css"></head><body><main class="wrap"><header><h1>騎手 芝・ダート スタイルシフトマップ P0</h1><p class="lead">同一騎手の芝・ダートにおける「前め」「動き」スコアの位置と移動を、4象限で比較する探索レポートです。</p><nav class="tabs"><a class="active" href="jockey_turf_dirt_style_shift_min100.html">min100版</a><a class="" href="jockey_turf_dirt_style_shift_min50.html">min50版</a></nav><p class="notice">能力ランキングではありません。騎乗馬構成などの差を含む記述的な比較であり、因果関係・将来成績・馬券の推奨を示すものではありません。</p></header><section class="panel"><div class="filters"><label>騎手名検索<input id="q" type="search" placeholder="例: 武"></label><label>最小シフト距離<input id="shift" type="number" min="0" step="0.1" value="0"></label><label>芝・ダート双方の最低騎乗数<input id="rides" type="number" min="0" step="50"></label><label>直近5年のみ<input id="recent" type="checkbox"></label></div><div class="meta"><span>min100：芝・ダートともに100騎乗以上</span><span>表示中 <b id="count">0</b> 人</span><span>基準日 2026-07-07 / 直近判定 cutoff 2021-07-07</span></div></section><section class="panel map"><svg id="map" viewBox="0 0 1000 660" role="img" aria-label="芝とダートの4象限スタイルシフトマップ"></svg><div class="legend"><span><i class="dot turf"></i>芝（円）</span><span><i class="dot dirt"></i>ダート（四角）</span><span><i class="line"></i>芝からダートへの移動</span><span>点・ラベル・カードは同じフィルタ条件で更新</span></div></section><section class="panel"><h2>代表カード</h2><div id="cards" class="cards"></div></section></main><div id="tip" class="tip"></div><script src="jockey_turf_dirt_style_shift.js"></script></body></html>
